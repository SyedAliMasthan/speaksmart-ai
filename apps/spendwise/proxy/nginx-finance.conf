# A new virtual host for HOST Nginx. Keep the root domain's existing config.
# Obtain a certificate for finance.example.com before enabling this file.
# Certificate paths below are the usual Certbot paths; confirm on your server.
server {
    listen 80;
    server_name finance.example.com;
    return 301 https://finance.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name finance.example.com;
    ssl_certificate /etc/letsencrypt/live/finance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace any client-supplied value. This is the only trusted proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
