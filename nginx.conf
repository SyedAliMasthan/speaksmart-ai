# Install inside the existing nginx http context (sites-enabled), not as nginx.conf.
# First install deploy/security-headers.conf to /etc/nginx/snippets/speaksmart-security.conf.
limit_req_zone $binary_remote_addr zone=speaksmart_api:10m rate=5r/s;
server {
    listen 80;
    server_name speaksmarts.in www.speaksmarts.in;
    return 301 https://speaksmarts.in$request_uri;
}
server {
    listen 443 ssl;
    server_name speaksmarts.in www.speaksmarts.in;
    ssl_certificate /etc/letsencrypt/live/speaksmarts.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speaksmarts.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/speaksmarts.in/dist;
    index index.html;
    client_max_body_size 6m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    include /etc/nginx/snippets/speaksmart-security.conf;
    location /api/ {
        limit_req zone=speaksmart_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 40s;
        proxy_cache off;
    }
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/speaksmart-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/speaksmart-security.conf;
        add_header Cache-Control "no-store" always;
    }
}
