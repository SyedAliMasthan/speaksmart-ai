# ═══════════════════════════════════════════════════════════════════════
# SpeakSmart AI — FORTRESS Nginx Configuration
# Security level: Maximum hardening — production enterprise grade
# ═══════════════════════════════════════════════════════════════════════

# ─── RATE LIMITING (DDoS + brute force protection) ───
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Block bad bots and scanners ───
map $http_user_agent $bad_bot {
    default 0;
    ~*(?:sqlmap|nikto|nmap|masscan|zgrab|dirbuster|gobuster|wpscan|burpsuite) 1;
    ~*(?:python-requests|curl\/|wget\/|scrapy|httpclient) 0; # allow legit tools
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name speaksmarts.in www.speaksmarts.in;
    return 301 https://speaksmarts.in$request_uri;
}

# Redirect www → non-www
server {
    listen 443 ssl http2;
    server_name www.speaksmarts.in;
    ssl_certificate     /etc/letsencrypt/live/speaksmarts.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speaksmarts.in/privkey.pem;
    return 301 https://speaksmarts.in$request_uri;
}

# ═══ MAIN SERVER ═══
server {
    listen 443 ssl http2;
    server_name speaksmarts.in;

    root /var/www/speaksmarts.in/dist;
    index index.html;

    # ─── SSL HARDENING ───
    ssl_certificate     /etc/letsencrypt/live/speaksmarts.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speaksmarts.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_ecdh_curve secp384r1;

    # ─── SECURITY HEADERS (A+ grade on securityheaders.com) ───
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;  # Modern: rely on CSP instead
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=()" always;

    # Content Security Policy — STRICT
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self'
            https://ikeoivqhrnpdfqdsiidj.supabase.co
            wss://ikeoivqhrnpdfqdsiidj.supabase.co
            https://api.groq.com;
        media-src 'self' blob:;
        worker-src 'self' blob:;
        frame-src 'none';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
    " always;

    # Hide server info (OCI Ubuntu compatible — no extra modules needed)
    server_tokens off;

    # ─── REQUEST SIZE LIMITS (prevent upload attacks) ───
    client_max_body_size 5m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ─── TIMEOUTS (prevent slowloris) ───
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # ─── CONNECTION LIMITS ───
    limit_conn conn_limit 20;

    # ─── BLOCK BAD BOTS ───
    if ($bad_bot) {
        return 444;  # drop connection silently
    }

    # ─── BLOCK COMMON ATTACK PATHS ───
    location ~* (\.php|\.asp|\.aspx|\.jsp|\.cgi|\.env|\.git|\.svn|\.htaccess|\.htpasswd|wp-admin|wp-login|wp-content|xmlrpc|phpmyadmin|adminer|\.sql|\.bak|\.old|\.orig|\.save|\.swp|\.tmp) {
        return 444;
    }

    # Block path traversal attempts
    location ~* (\.\./|\.\.\\) {
        return 444;
    }

    # ─── COMPRESSION ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml application/wasm;

    # ─── STATIC ASSETS — IMMUTABLE CACHE ───
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;

        # Prevent hotlinking
        valid_referers none blocked server_names *.speaksmarts.in;
        if ($invalid_referer) {
            return 403;
        }
    }

    # Favicon & icons
    location ~* ^/(favicon|icon|apple-touch|og-image)\.(svg|png|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ─── SEO FILES (serve directly, NOT SPA fallback) ───
    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Content-Type "text/plain";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /manifest.json {
        try_files /manifest.json =404;
        add_header Content-Type "application/manifest+json";
    }

    # ─── SERVICE WORKER ───
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ─── API PROXY (Edge Functions with rate limiting) ───
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass https://ikeoivqhrnpdfqdsiidj.supabase.co/functions/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent SSRF
        proxy_redirect off;
        proxy_buffering on;
    }

    # ─── SPA FALLBACK ───
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }

    # ─── ERROR PAGES ───
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
